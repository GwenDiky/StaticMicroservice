[tool.poetry]
name = "staticmicroservice"
version = "0.1.0"
description = ""
authors = ["Tamagil <tamagiltamagil@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pre-commit = "^4.0.1"
fastapi = "^0.115.5"
uvicorn = "^0.32.1"
black = "^24.10.0"
motor = "3.6.0"
pydantic = "^2.10.2"
pydantic-settings = "^2.6.1"
sqlalchemy = "^2.0.36"
asyncpg = "^0.30.0"
confluent-kafka = "^2.6.1"
aiokafka = "^0.12.0"
isort = "^5.13.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_calls = false
